# Run with prek or pre-commit: `prek install` once per clone.
# The hook is the check CI runs after `bun install`.
# It reads the working tree, not the index, so an unstaged
# file passes here and still fails CI.
repos:
  - repo: local
    hooks:
      - id: package-validate
        name: OMP package and skill invariants
        entry: node tools/validate-package.mjs
        language: system
        pass_filenames: false
        always_run: true
