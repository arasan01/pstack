name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-skills:
    name: OMP package and skills validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check OMP packaging and skill invariants
        run: bun tools/validate-package.mjs
      - name: Run root unit and invariant tests
        run: bun test tests/

  windows-worktree-audit:
    name: Windows workspace and subprocess safety
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test the worktree audit
        run: bun test --timeout 30000 tests/worktree-audit.test.mjs tests/omp-smoke.test.mjs

  scripts:
    name: Vendored bun tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/poteto-mode/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      # Pinned here, not in package.json, so bun.lock stays identical to
      # upstream's. 3.6.2 is the newest release that reproduces upstream's
      # watch-pr files byte for byte; later ones rewrap its types.ts.
      - name: Check formatting
        run: bunx prettier@3.6.2 --check .

  statechart:
    name: Statechart compiler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/statechart/scripts
    env:
      TLA2TOOLS: ${{ github.workspace }}/.tla2tools.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download pinned TLC
        run: |
          curl --fail --location --silent --show-error \
            --output "$TLA2TOOLS" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          printf '%s  %s\n' \
            936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88 \
            "$TLA2TOOLS" | sha256sum --check
      - name: Test compiler and real TLC integration
        run: bun run test

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: |
          shellcheck --version
          find . -path ./.git -prune -o -path '*/node_modules' -prune -o -name '*.sh' -print |
            sed 's#^\./##' | sort | tee /dev/stderr | xargs shellcheck --severity=warning

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -no-color

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.18.1 '**/*.md'

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check relative links and fragments
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --offline --no-progress --include-fragments \
            --exclude-path node_modules --exclude-path .git '**/*.md'

  macos-worktree-audit:
    name: macOS workspace and subprocess safety
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test the worktree audit
        run: bun test --timeout 30000 tests/worktree-audit.test.mjs tests/omp-smoke.test.mjs
